      text_preview: 曹操逃到中牟县，被守关兵士抓获。半夜里，县令陈宫提审曹操。曹操瞒不过，就说了行刺董卓之事和自己欲兴兵讨伐董卓的志向。陈宫深受所感，便弃了官，同曹操一同前往。
