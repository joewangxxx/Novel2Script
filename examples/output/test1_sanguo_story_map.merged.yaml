    - id: p_010
      index: 10
      text_preview: 这边，董卓来到了后园。他看到吕布的画戟靠在一边，两人在亭中说话，不由大怒，抓起画戟大喝一声。吕布大惊，转身就逃。董卓身体肥胖，追不上，便用力将戟向吕布掷去。吕…
      char_count: 269
    - id: p_011
      index: 11
      text_preview: 王允见时机成熟，便用言语激怒吕布。吕布当即立下誓言，要杀董卓。过了几天，王允派人将董卓骗到长安，说让他来做皇帝。董卓得意扬扬地上了朝堂，发现势头不对，回头大叫…
      char_count: 170
    - id: p_012
      index: 12
      text_preview: 董卓部将李傕等人听说董卓被杀，便从陕西招兵十余万，分四路杀进长安。吕布抵挡不住，带领家小投奔袁术去了。王允则被李傕等人杀死。大权又落入了李傕等人手中，长安城内…
      char_count: 86
  - id: ch_005
    index: 5
    title: 陶恭祖三让徐州
    source_heading: 第五回 陶恭祖三让徐州
    paragraphs:
    - id: p_001
      index: 1
      text_preview: 曹操在兖州，整顿兵马，广招贤纳士。先后有谋士荀彧、荀攸、程昱，郭嘉、满宠、吕虔等人，武将于禁、典韦等前来投奔，曹操一一予以重用。此时曹操部下文有谋臣，武有猛将…
      char_count: 177
    - id: p_002
      index: 2
      text_preview: 曹操得到音讯，哭倒在地。曹操切齿道：“陶谦纵容手下杀我父亲，此仇不共戴天！我现在就起大军荡平徐州，方解我心头之恨！”他带领大军，令夏侯渊、于禁、典韦为先锋，竖…
      char_count: 105
    - id: p_003
      index: 3
      text_preview: 陶谦，字恭祖，本是一个温厚君子，见曹操起兵报仇，杀戮百姓，仰天痛哭。他对部下说，曹军势大，难以抵敌，不如将他绑了，送给曹操，救徐州百姓性命。部下不允。麋竺献计…
      char_count: 98
    - id: p_004
      index: 4
      text_preview: 麋竺见了孔融，说了来意。正商议间，忽然黄巾余党管亥带领几万人杀向徐州。孔融料想难以抵挡，便派人去向刘备求救。刘备见孔融这样看重自己，当即与关羽、张飞领兵三千去…
      char_count: 142
    - id: p_005
      index: 5
      text_preview: 孔融将刘备接进城里，摆宴庆贺。孔融又邀请刘备一同去救徐州。刘备答应向公孙瓒借些兵马，随后就来。
      char_count: 47
    - id: p_006
      index: 6
      text_preview: 刘备借得两千兵马和勇将赵云，连同本部三千人来救徐州。到了徐州城下，张飞一阵冲杀，杀退于禁。刘备入了城，陶谦设宴相待。陶谦见刘备器宇轩昂，言语不俗，心中大喜，便…
      char_count: 269
    - id: p_007
      index: 7
      text_preview: 刘备写出了书信，劝曹操退兵。曹操得信，大骂刘备。忽然流星马来报，吕布已袭破兖州。原来吕布自逃出长安，先后投奔袁术、袁绍、张杨等人，都不能长久，现在张邈手下来袭…
      char_count: 111
    - id: p_008
      index: 8
      text_preview: 闻知曹操退兵，陶谦大喜，邀请众人聚会。饮宴后，陶谦请刘备坐于上座，再三要让徐州。刘备道：“刘备来救徐州，是为了大义。现在无缘无故占徐州为己有，天下都将以为刘备…
      char_count: 196
    - id: p_009
      index: 9
      text_preview: 不久，陶谦染上重病。陶谦自知年高，身体难以好转，便请刘备来商议军务。陶谦再次将印牌相让，并让孙乾、麋竺辅佐刘备。刘备仍然再三推辞，陶谦以手指心而死。关羽、张飞…
      char_count: 109
    - id: p_010
      index: 10
      text_preview: 却说曹操回到兖州，与吕布多次激战，终于大败吕布。吕布收拾残兵，来徐州投奔刘备。刘备道：“吕布是当今天下的勇士，应该出门迎接！”麋竺劝刘备：“吕布是虎狼之徒，不…
      char_count: 169
    - id: p_011
      index: 11
      text_preview: 于是刘备率众出城三十里迎接吕布，跟吕布并马进了徐州。谈话间，刘备提出要将徐州相让。吕布大喜，正要伸手去接印牌，只见刘备背后关羽、张飞满面怒容，当即假意推辞说：…
      char_count: 98
    - id: p_012
      index: 12
      text_preview: 次日，吕布回请刘备，刘备领关张二人同去。饮酒到半酣，吕布请刘备入后堂，让妻妾们出来拜见刘备。刘备再三谦让，吕布说：“贤弟不必推让了！”张飞听了，瞪圆眼大喝道：…
      char_count: 188
    - id: p_013
      index: 13
      text_preview: 次日，吕布来向刘备辞行。刘备劝慰吕布，又让吕布领兵先到小沛驻扎。
      char_count: 32
    - id: p_014
      index: 14
      text_preview: 这时，朝中掌权的李傕与郭汜两人发生火并，长安城内一片混乱。大臣杨奉、国舅董承等人乘机保护献帝逃回洛阳，一路上刀兵迭起，狼狈不堪。到洛阳后，改元建安元年。献帝见…
      char_count: 111
    - id: p_015
      index: 15
      text_preview: 曹操进洛阳击退了李榷、郭汜，自己做了丞相。曹操见洛阳荒废，让献帝迁都许都。献帝不敢不从，群臣惧怕曹操，也不敢有什么异议。于是曹操迁都许都，大兴土木，封官授爵。…
      char_count: 108
    - id: p_016
      index: 16
      text_preview: 曹操为了让吕布与刘备互相残杀，下诏正式封刘备为徐州牧，并写密信让刘备杀吕布。刘备召吕布前来，将曹操密信出示给吕布，表示决不会做此不义之事。吕布再三拜谢，感激涕…
      char_count: 176
