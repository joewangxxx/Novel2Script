      A weathered NOTICE BOARD stands at the crossroads, CROWDS milling past. LIU
      BEI (30s, worn sandals, frayed robes—descended of imperial blood, yet sunk to
      weaving mats) stops before it. His eyes trace the OFFICIAL PROCLAMATION: a call
