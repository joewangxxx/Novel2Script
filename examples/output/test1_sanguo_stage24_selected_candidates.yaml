    proposed_text: 'EXT. TOWN SQUARE - DAY


      A weathered NOTICE BOARD stands at the crossroads, CROWDS milling past. LIU
      BEI (30s, worn sandals, frayed robes—descended of imperial blood, yet sunk to
      weaving mats) stops before it. His eyes trace the OFFICIAL PROCLAMATION: a call
      to arms against the Yellow Turbans.


      He exhales—a long, weighted SIGH. Shoulders slump. Fingers tighten on his woven
      satchel.


      VOICE (O.S.)

      (rough, contemptuous)

      A true man who does nothing for his country—


      Liu Bei turns.


      Zhang Fei (40s, blacksmith''s build, bristling beard) glares at him from two
      paces away, meat-wine breath, fists like hams.


      The SOUND of the crowd DROPS AWAY. Two men locked in the first spark of history.'
    proposed_change: {}
    rationale: Establishes Liu Bei's low status against noble lineage (internal conflict),
      grounds the iconic sigh in physical action, and stages the confrontational meet-cute
      with Zhang Fei as visual tension rather than exposition. The beat transitions
      from solitary contemplation to interpersonal catalyst per source event evt_001.
