  chapters:
  - id: ch_001
    index: 1
    title: 雾里的钟声
    source_heading: '## 第一章：雾里的钟声'
    paragraphs:
    - id: p_001
      index: 1
      text_preview: 海边小镇连续三晚起雾。林岚在旧邮局值夜班时，听见已经停摆十年的钟楼响了一下。她以为是风，直到柜台下方滑出一封没有邮票的蓝色信封。
      char_count: 64
    - id: p_002
      index: 2
      text_preview: 信封上写着她父亲的名字。父亲七年前出海失踪，镇上的人早已不再提起。林岚拆开信，里面只有一句话：如果灯塔亮起，别让他们上船。
      char_count: 61
  - id: ch_002
    index: 2
    title: 不该亮的灯
    source_heading: '## 第二章：不该亮的灯'
    paragraphs:
    - id: p_001
      index: 1
      text_preview: 第二天傍晚，修灯工周澈来到邮局。他说灯塔的电路早被切断，不可能自行亮起。林岚把信递给他，周澈沉默很久，只说当年最后见过她父亲的人并不只有他。
      char_count: 70
    - id: p_002
      index: 2
      text_preview: 夜里，远处废弃灯塔突然亮了。雾像被光切开，一艘没有编号的旧船停在礁石外。船上有人影挥手，像是在招呼镇民靠近。
      char_count: 54
  - id: ch_003
    index: 3
    title: 回声
    source_heading: '## 第三章：回声'
    paragraphs:
    - id: p_001
      index: 1
      text_preview: 镇长组织人去码头，声称那可能是失踪渔船。林岚拦住他们，却拿不出证据。周澈把一只旧录音机交给她，里面有她父亲最后的留言：船不是回来，是在找替身。
      char_count: 71
    - id: p_002
      index: 2
      text_preview: 林岚冲进钟楼，敲响旧钟。钟声压过海浪，灯塔的光忽然熄灭。旧船在雾中后退，甲板上的人影同时转身，看向她。
      char_count: 51
