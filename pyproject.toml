[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "novel2script"
version = "0.2.0"
description = "Deterministic validators and Fountain export tools for Novel2Script."
requires-python = ">=3.10"
dependencies = [
  "jsonschema>=4.0.0",
  "PyYAML>=6.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
novel2script = "novel2script.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
